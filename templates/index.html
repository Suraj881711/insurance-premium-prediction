<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Insurance Charge Predictor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb, #a6c1ee);
      --surface: #ffffff;
      --text: #2b2b2b;
      --muted: #555;
      --brand: #ff6b6b;
      --brand-2: #feca57;
      --brand-3: #1dd1a1;
      --brand-4: #54a0ff;
      --radius: 16px;
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg);
      background-size: 400% 400%;
      animation: gradientShift 12s ease infinite;
      color: var(--text);
      line-height: 1.6;
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .site-header { background: rgba(255,255,255,.85); backdrop-filter: blur(10px); box-shadow: var(--shadow); }
    .nav { max-width: 1000px; margin:auto; padding:14px 20px; display:flex; justify-content:space-between; align-items:center; }
    .brand { font-weight:800; font-size:1.4rem; color:var(--brand-4); text-decoration:none; }
    .links a { margin-left:15px; text-decoration:none; color:var(--muted); font-weight:600; padding:6px 12px; border-radius:var(--radius); transition:.3s; }
    .links a:hover, .links a.active { background: var(--brand-2); color:#fff; }
    .container { max-width:800px; margin:40px auto; padding:0 20px; }
    .hero { text-align:center; margin-bottom:20px; }
    .hero h1 { font-size:2.2rem; background:linear-gradient(90deg,var(--brand),var(--brand-3),var(--brand-4)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .card { background:var(--surface); border-radius:var(--radius); padding:24px; box-shadow:var(--shadow); }
    .form { display:flex; flex-direction:column; gap:16px; }
    .field { display:flex; flex-direction:column; }
    label { font-weight:600; margin-bottom:4px; }
    input,select { padding:10px; border-radius:var(--radius); border:2px solid #eee; font-size:1rem; }
    input:focus,select:focus { border-color:var(--brand-4); outline:none; }
    .actions { display:flex; gap:12px; justify-content:center; margin-top:12px; }
    .btn { padding:10px 20px; border-radius:var(--radius); border:none; cursor:pointer; font-weight:bold; transition:.3s; }
    .btn.primary { background:var(--brand); color:#fff; }
    .btn.primary:hover { background:var(--brand-4); }
    .btn:hover { transform:scale(1.05); }
    .site-footer { text-align:center; padding:15px; background:rgba(255,255,255,0.85); margin-top:30px; }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="brand" href="/">InsureAI</a>
      <div class="links">
        <a class="active" href="/">Home</a>
        <a href="/about">About</a>
      </div>
    </nav>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Predict Your Insurance Charges</h1>
      <p>Enter your details and get an instant estimate powered by ML.</p>
    </section>

    <section class="card">
      <form class="form" action="/predict" method="POST">
        {% if error %}
        <p style="background:#ffe3e3; color:#a00; padding:10px; border-radius:8px;">{{ error }}</p>
        {% endif %}
        <div class="field">
          <label for="age">Age</label>
          <input id="age" name="age" type="number" placeholder="e.g., 30" required />
        </div>
        <div class="field">
          <label for="sex">Sex</label>
          <select id="sex" name="sex" required>
            <option value="" disabled selected>Select</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
        </div>
        <div class="field">
          <label for="bmi">BMI</label>
          <input id="bmi" name="bmi" type="number" step="0.1" placeholder="e.g., 26.5" required />
        </div>
        <div class="field">
          <label for="children">Children</label>
          <input id="children" name="children" type="number" placeholder="e.g., 2" required />
        </div>
        <div class="field">
          <label for="smoker">Smoker</label>
          <select id="smoker" name="smoker" required>
            <option value="" disabled selected>Select</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
          </select>
        </div>
        <div class="field">
          <label for="region">Region</label>
          <select id="region" name="region" required>
            <option value="" disabled selected>Select</option>
            <option value="northeast">Northeast</option>
            <option value="northwest">Northwest</option>
            <option value="southeast">Southeast</option>
            <option value="southwest">Southwest</option>
          </select>
        </div>
        <div class="actions">
          <button class="btn primary" type="submit">Predict</button>
          <button class="btn" type="reset">Clear</button>
        </div>
      <p style="text-align:center; font-size:0.9rem; color:#555;">💡 Sample: age 40, male, BMI 30, 2 children, smoker — yes, region — southeast</p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>© <span id="year"></span> InsureAI</p>
  </footer>
  <script>document.getElementById('year').textContent=new Date().getFullYear();</script>
</body>
</html>
